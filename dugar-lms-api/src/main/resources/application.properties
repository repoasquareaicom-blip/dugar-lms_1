spring.application.name=dugar-lms-api

server.port=8080
#pro lms 
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dugar_lms_2.0}
spring.datasource.username=dugar_lms_user
#pro lms local
#spring.datasource.url=jdbc:postgresql://127.0.0.1:5434/dugar_lms

#core lms local
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/corelms}
#cor for aws
#spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/corelms}
#spring.datasource.username=postgres


spring.datasource.password=mysecret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000


spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

app.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-at-least-32-bytes}
app.jwt.expiration-ms=28800000
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
app.word-templates.storage-dir=${WORD_TEMPLATE_STORAGE_DIR:./storage/word-templates}
app.word-templates.max-file-size-bytes=${WORD_TEMPLATE_MAX_FILE_SIZE_BYTES:10485760}

# Document AI: disabled until explicitly configured; credentials stay server-side.
app.document-ai.enabled=${DOCUMENT_AI_ENABLED:true}
app.document-ai.api-key=${OPENAI_API_KEY:}
app.document-ai.model=${DOCUMENT_AI_MODEL:gpt-5-mini}
# Standard USD token rates per million; API key and exchange rate are backend-only.
# Set DOCUMENT_AI_USD_INR to the agreed exchange rate before enabling Hindi conversion.
app.document-ai.input-usd-per-million=${DOCUMENT_AI_INPUT_USD_PER_MILLION:0.25}
app.document-ai.cached-input-usd-per-million=${DOCUMENT_AI_CACHED_INPUT_USD_PER_MILLION:0.025}
app.document-ai.output-usd-per-million=${DOCUMENT_AI_OUTPUT_USD_PER_MILLION:2.00}
app.document-ai.usd-inr=${DOCUMENT_AI_USD_INR:94}

# Requires LibreOffice Writer and the fonts used by English/Hindi master DOCX files.
app.document-pdf.executable=${DOCUMENT_PDF_EXECUTABLE:soffice}
app.document-pdf.timeout-seconds=${DOCUMENT_PDF_TIMEOUT_SECONDS:120}
app.document-exports.storage-dir=${DOCUMENT_EXPORT_STORAGE_DIR:./storage/document-exports}
app.document-exports.max-bytes=${DOCUMENT_EXPORT_MAX_BYTES:1073741824}
app.document-exports.max-contracts=${DOCUMENT_EXPORT_MAX_CONTRACTS:100000}
